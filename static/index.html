<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Passcore Web</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <div id="header">
            <h1>Check Your Password Strength</h1>
            <p>Powered by Passcore</p>
        </div>
        <section class="card">
            <form action="passcore-web-production.up.railway.app" method="post" id="password-form">
                <div class="input-wrapper">
                    <input type="text" name="password" id="password" placeholder="Enter your password...">
                    <div id="strength-bar"></div>
                </div>

                <input type="submit" value="submit">
            </form>
        </section>
        <div id="results" class="results"></div>
    </main>
    <footer>
        <p>Passwords are <strong>NEVER</strong> saved on the server.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
